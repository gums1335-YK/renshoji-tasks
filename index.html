<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const localStore = {
  async get(key) {
    try {
      const v = localStorage.getItem("renshoji:" + key);
      if (v === null) return null;
      return { key, value: v };
    } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      localStorage.setItem("renshoji:" + key, value);
      return { key, value };
    } catch (e) { return null; }
  },
};

const CATEGORY_CONFIG = {
  行事: { icon: "🙏", color: "#6b4c8a", bg: "rgba(107,76,138,0.10)", badgeBg: "#f3eef8", badgeBorder: "#c9a8e0", dotColor: "#6b4c8a" },
  発送: { icon: "📮", color: "#1a5c8a", bg: "rgba(26,92,138,0.10)", badgeBg: "#eaf3fb", badgeBorder: "#8ec4e8", dotColor: "#1a5c8a" },
  発注: { icon: "📦", color: "#7a5230", bg: "rgba(122,82,48,0.10)", badgeBg: "#faf3ea", badgeBorder: "#e0c48e", dotColor: "#b8923a" },
  私用: { icon: "🌿", color: "#4a7a5a", bg: "rgba(74,122,90,0.10)", badgeBg: "#eef5ee", badgeBorder: "#a8c9ae", dotColor: "#4a7a5a" },
};
const STATUS_CONFIG = {
  実行前: { label: "実行前", color: "#6b7280", bg: "#f3f4f6" },
  実行中: { label: "実行中", color: "#1d4ed8", bg: "#dbeafe" },
  完了済み: { label: "完了済み", color: "#166534", bg: "#dcfce7" },
};
const WEEKDAYS = ["日","月","火","水","木","金","土"];

const HOLIDAYS = new Set([
  "2026-1-1","2026-1-12","2026-2-11","2026-2-23","2026-3-20","2026-4-29",
  "2026-5-3","2026-5-4","2026-5-5","2026-5-6","2026-7-20","2026-8-11",
  "2026-9-21","2026-9-22","2026-9-23","2026-10-12","2026-11-3","2026-11-23",
  "2027-1-1","2027-1-11","2027-2-11","2027-2-23","2027-3-20","2027-4-29",
  "2027-5-3","2027-5-4","2027-5-5","2027-7-19","2027-8-11","2027-9-20",
  "2027-9-23","2027-10-11","2027-11-3","2027-11-23",
]);
function isHoliday(year, month, day) {
  return HOLIDAYS.has(year + "-" + month + "-" + day);
}

function getEquinox(year, type) {
  if (type === "spring") {
    const d = Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    return new Date(year, 2, d);
  } else {
    const d = Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    return new Date(year, 8, d);
  }
}

function buildTasks(year) {
  const spring = getEquinox(year, "spring");
  const autumn = getEquinox(year, "autumn");
  const springLabel = (spring.getMonth() + 1) + "月" + spring.getDate() + "日";
  const autumnLabel = (autumn.getMonth() + 1) + "月" + autumn.getDate() + "日";
  const springMonth = spring.getMonth() + 1;
  const autumnMonth = autumn.getMonth() + 1;

  const yearly = [
    { id: "t01", name: "修正会", category: "行事", month: 1, day: 1 },
    { id: "t02", name: "新年法話会", category: "行事", month: 1, day: 27 },
    { id: "t03", name: "寺報発注", category: "発注", month: 2, day: 15 },
    { id: "t04", name: "春彼岸会 案内状発送・寺報発送", category: "発送", month: 2, day: 20 },
    { id: "t05", name: "永代経 案内状発送", category: "発送", month: 3, day: 15 },
    { id: "t06", name: "春彼岸会（" + springLabel + "）", category: "行事", month: springMonth, day: spring.getDate() },
    { id: "t07", name: "永代経", category: "行事", month: 4, day: 15 },
    { id: "t08", name: "逮夜雅楽演奏 案内状発送", category: "発送", month: 4, day: 27 },
    { id: "t09", name: "逮夜雅楽演奏", category: "行事", month: 5, day: 27 },
    { id: "t10", name: "7月お盆案内 発送", category: "発送", month: 6, day: 10 },
    { id: "t11", name: "夏の法話会 案内状発送", category: "発送", month: 6, day: 27 },
    { id: "t12", name: "8月お盆案内・合同盆案内 発送", category: "発送", month: 7, day: 10 },
    { id: "t13", name: "夏の法話会", category: "行事", month: 7, day: 27 },
    { id: "t14", name: "合同盆", category: "行事", month: 8, day: 13 },
    { id: "t15", name: "寺報発注", category: "発注", month: 8, day: 15 },
    { id: "t16", name: "秋彼岸会 案内状発送・寺報発送", category: "発送", month: 8, day: 20 },
    { id: "t17", name: "10月お取越案内 発送", category: "発送", month: 9, day: 10 },
    { id: "t18", name: "秋彼岸会（" + autumnLabel + "）", category: "行事", month: autumnMonth, day: autumn.getDate() },
    { id: "t19", name: "11月お取越案内 発送", category: "発送", month: 10, day: 10 },
    { id: "t20", name: "報恩講 案内状発送・カレンダー発送", category: "発送", month: 10, day: 23 },
    { id: "t21", name: "報恩講", category: "行事", month: 11, day: 23 },
    { id: "t22", name: "新年法話会 案内状発送", category: "発送", month: 12, day: 27 },
    { id: "t23", name: "新年法話会 講師依頼状発送", category: "発送", month: 12, day: 20 },
    { id: "t24", name: "春彼岸会 講師依頼状発送", category: "発送", month: 2, day: 20 },
    { id: "t25", name: "夏の法話会 講師依頼状発送", category: "発送", month: 6, day: 20 },
    { id: "t26", name: "秋彼岸会 講師依頼状発送", category: "発送", month: 8, day: 20 },
    { id: "t27", name: "報恩講 講師依頼状発送", category: "発送", month: 10, day: 20 },
    { id: "t28", name: "7・8月初盆確認発送", category: "発送", month: 6, day: 10 },
    { id: "t29", name: "8月初盆案内 発送", category: "発送", month: 7, day: 10 },
    { id: "t30", name: "春彼岸・上半期合同年忌法要", category: "行事", month: springMonth, day: spring.getDate() + 1 },
    { id: "t31", name: "秋彼岸・下半期合同年忌法要", category: "行事", month: autumnMonth, day: autumn.getDate() + 1 },
    { id: "t32", name: "報恩講", category: "行事", month: 11, day: 24 },
  ];

  const monthly = [];
  for (let m = 1; m <= 12; m++) {
    if (m % 2 === 0) {
      monthly.push({ id: "gyaku-" + m, name: "お逮夜法要", category: "行事", month: m, day: 27, recurrence: "毎月" });
    }
    monthly.push({ id: "doboshi-" + m, name: "同朋新聞発送", category: "発送", month: m, day: 21, recurrence: "毎月" });
  }

  return yearly.map(function(t){ return Object.assign({}, t, { recurrence: "毎年", date: new Date(year, t.month - 1, t.day) }); })
    .concat(monthly.map(function(t){ return Object.assign({}, t, { date: new Date(year, t.month - 1, t.day) }); }))
    .sort(function(a,b){ return a.date - b.date; });
}

function getDaysUntil(date) {
  const todayD = new Date(); todayD.setHours(0,0,0,0);
  const d = new Date(date); d.setHours(0,0,0,0);
  return Math.ceil((d - todayD) / 86400000);
}
function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return (d.getMonth()+1) + "月" + d.getDate() + "日";
}
function formatDateWithWeekday(month, day, year) {
  const d = new Date(year, month - 1, day);
  return { main: month + "月" + day + "日", weekday: "（" + WEEKDAYS[d.getDay()] + "）" };
}
function prevMemoKey(task, year) {
  if (task.recurrence === "毎月") {
    const pm = task.month - 1;
    if (pm === 0) return { year: year - 1, id: task.id.replace(/-\d+$/, "-12") };
    return { year: year, id: task.id.replace(/-\d+$/, "-" + pm) };
  }
  return { year: year - 1, id: task.id };
}
function getCardStyle(days, status, category, isGyoji) {
  const cat = CATEGORY_CONFIG[category];
  const opacity = status === "完了済み" ? 0.55 : 1;
  let bg, border;
  if (status === "完了済み") {
    bg = "rgba(200,200,200,0.12)";
    border = "1px solid rgba(0,0,0,0.15)";
  } else if (!isGyoji && days < 0) {
    bg = "rgba(220,38,38,0.10)";
    border = "2.5px solid rgba(220,38,38,0.85)";
  } else if (days <= 5) {
    bg = cat.bg;
    border = "2.5px solid rgba(220,38,38,0.85)";
  } else if (days <= 15) {
    bg = cat.bg;
    border = "2.5px solid rgba(234,179,8,0.85)";
  } else {
    bg = cat.bg;
    border = "1px solid rgba(0,0,0,0.18)";
  }
  return { background: bg, border: border, borderRadius: 14, opacity: opacity, transition: "all 0.2s", boxShadow: "0 1px 4px rgba(0,0,0,0.06)" };
}

function UrgencyBadge(props) {
  const days = props.days, isGyoji = props.isGyoji, isDone = props.isDone;
  const b = function(color, bg, label) {
    return React.createElement('span', { style:{ fontSize:"0.68rem", color:color, fontWeight:700, background:bg, padding:"2px 8px", borderRadius:99 } }, label);
  };
  if (isDone) return b("#1d4ed8","#dbeafe","完了");
  if (isGyoji) {
    if (days < 0)   return null;
    if (days === 0) return b("#dc2626","#fee2e2","本日");
    if (days <= 5)  return b("#dc2626","#fee2e2","あと"+days+"日");
    if (days <= 15) return b("#b45309","#fef3c7","あと"+days+"日");
    return b("#6b7280","#f3f4f6","あと"+days+"日");
  }
  if (days < 0)   return b("#dc2626","#fee2e2","期限超過");
  if (days === 0) return b("#dc2626","#fee2e2","本日");
  if (days <= 5)  return b("#dc2626","#fee2e2","あと"+days+"日");
  if (days <= 15) return b("#b45309","#fef3c7","あと"+days+"日");
  return b("#6b7280","#f3f4f6","あと"+days+"日");
}

const MIN_YEAR = new Date().getFullYear();

function App() {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [filterCat, setFilterCat] = useState("すべて");
  const [filterStatus, setFilterStatus] = useState("すべて");
  const [filterMonth, setFilterMonth] = useState(today.getMonth() + 1);
  const [statuses, setStatuses] = useState({});
  const [memos, setMemos] = useState({});
  const [completedDates, setCompletedDates] = useState({});
  const [customTasks, setCustomTasks] = useState({});
  const [allMemos, setAllMemos] = useState({});
  const [storageReady, setStorageReady] = useState(false);
  const [showAddModal, setShowAddModal] = useState(false);
  const [newTask, setNewTask] = useState({ name:"", category:"行事", month:1, day:1, recurrence:"単発", noDate:false });
  const [openMemoId, setOpenMemoId] = useState(null);
  const [editTask, setEditTask] = useState(null);
  const [overrides, setOverrides] = useState({});
  const [deletedIds, setDeletedIds] = useState(new Set());
  const [selectedDay, setSelectedDay] = useState(null);
  const [viewMode, setViewMode] = useState("list");
  const [notification, setNotification] = useState(null);
  const notifShown = useRef(false);
  const touchStartX = useRef(null);
  const scrollContainerRef = useRef(null);

  const STORAGE_KEY   = "v2_" + year;
  const MEMO_ALL_KEY  = "memos_all";
  const CUSTOM_ALL_KEY = "custom_all";

  useEffect(function() {
    setStorageReady(false);
    notifShown.current = false;
    (async function() {
      try {
        const r = await localStore.get(STORAGE_KEY);
        if (r && r.value) {
          const p = JSON.parse(r.value);
          setStatuses(p.statuses || {}); setCompletedDates(p.completedDates || {}); setMemos(p.memos || {});
          setOverrides(p.overrides || {});
          setDeletedIds(new Set(p.deletedIds || []));
        } else { setStatuses({}); setCompletedDates({}); setMemos({}); setOverrides({}); setDeletedIds(new Set()); }
        const rm = await localStore.get(MEMO_ALL_KEY);
        const loadedMemos = rm && rm.value ? JSON.parse(rm.value) : {};
        setAllMemos(function(prev){ return Object.assign({}, prev, loadedMemos); });
        const rc = await localStore.get(CUSTOM_ALL_KEY);
        setCustomTasks(rc && rc.value ? JSON.parse(rc.value) : {});
      } catch (e) { setStatuses({}); setCompletedDates({}); setMemos({}); setAllMemos({}); setCustomTasks({}); }
      setStorageReady(true);
    })();
  }, [year]);

  useEffect(function() {
    if (!storageReady) return;
    (async function() { try { await localStore.set(STORAGE_KEY, JSON.stringify({ statuses:statuses, completedDates:completedDates, memos:memos, overrides:overrides, deletedIds: Array.from(deletedIds) })); } catch(e){} })();
  }, [statuses, completedDates, memos, overrides, deletedIds, storageReady]);

  useEffect(function() {
    if (!storageReady) return;
    const updated = Object.assign({}, allMemos);
    updated[year] = memos;
    setAllMemos(updated);
    (async function() { try { await localStore.set(MEMO_ALL_KEY, JSON.stringify(updated)); } catch(e){} })();
  }, [memos, storageReady]);

  useEffect(function() {
    if (!storageReady) return;
    (async function() { try { await localStore.set(CUSTOM_ALL_KEY, JSON.stringify(customTasks)); } catch(e){} })();
  }, [customTasks, storageReady]);

  useEffect(function() {
    if (!storageReady) return;
    const today2 = new Date();
    const cutoff = new Date(today2.getFullYear(), today2.getMonth() - 1, 15);
    cutoff.setHours(23, 59, 59, 999);
    setStatuses(function(prev) {
      const tasks2 = buildTasks(year);
      const custom2 = (customTasks[year] || []).map(function(t){ return Object.assign({}, t, { date: new Date(year, t.month-1, t.day) }); });
      const targets = tasks2.concat(custom2).filter(function(t){
        return t.category !== "行事" && t.date <= cutoff && prev[t.id] !== "完了済み";
      });
      if (targets.length === 0) return prev;
      const next = Object.assign({}, prev);
      targets.forEach(function(t){ next[t.id] = "完了済み"; });
      const now = new Date().toISOString();
      setCompletedDates(function(cd) {
        const ncd = Object.assign({}, cd);
        targets.forEach(function(t){ if (!ncd[t.id]) ncd[t.id] = now; });
        return ncd;
      });
      return next;
    });
  }, [storageReady]);

  useEffect(function() {
    if (!storageReady || notifShown.current) return;
    notifShown.current = true;
    const tasks = buildTasks(year);
    const custom = (customTasks[year] || []).map(function(t){ return Object.assign({}, t, { date: new Date(year, t.month-1, t.day) }); });
    const urgent = tasks.concat(custom).filter(function(t) {
      const days = getDaysUntil(t.date);
      return days >= 0 && days <= 7 && (statuses[t.id] || "実行前") !== "完了済み";
    });
    if (urgent.length > 0) setNotification("今週中に期限のタスクが " + urgent.length + " 件あります。");
  }, [storageReady]);

  const baseTasks = useMemo(function(){ return buildTasks(year); }, [year]);
  const allTasks = useMemo(function() {
    const custom = (customTasks[year] || []).map(function(t) {
      return Object.assign({}, t, { date: t.noDate ? null : new Date(year, t.month-1, t.day) });
    });
    const base = baseTasks
      .filter(function(t){ return !deletedIds.has(t.id); })
      .map(function(t) {
        if (overrides[t.id]) {
          const ov = overrides[t.id];
          return Object.assign({}, t, ov, { date: new Date(year, (ov.month||t.month)-1, ov.day||t.day) });
        }
        return t;
      });
    const dated = base.concat(custom.filter(function(t){ return !t.noDate; })).sort(function(a,b){ return a.date - b.date; });
    const noDated = custom.filter(function(t){ return t.noDate; });
    return dated.concat(noDated);
  }, [baseTasks, customTasks, year, overrides, deletedIds]);

  const filtered = useMemo(function() {
    const list = allTasks.filter(function(t) {
      if (filterCat !== "すべて" && t.category !== filterCat) return false;
      const st = statuses[t.id] || "実行前";
      if (filterStatus !== "すべて") {
        if (t.category === "行事") return false;
        if (st !== filterStatus) return false;
      }
      if (!t.noDate && filterMonth !== 0 && t.month !== filterMonth) return false;
      return true;
    });
    return list.sort(function(a, b) {
      if (a.noDate && b.noDate) return 0;
      if (a.noDate) return 1;
      if (b.noDate) return -1;
      const sa = statuses[a.id] || "実行前";
      const sb = statuses[b.id] || "実行前";
      const aDone = a.category !== "行事" && sa === "完了済み" ? 1 : 0;
      const bDone = b.category !== "行事" && sb === "完了済み" ? 1 : 0;
      if (aDone !== bDone) return aDone - bDone;
      return a.date - b.date;
    });
  }, [allTasks, filterCat, filterStatus, filterMonth, statuses]);

  function setStatus(id, newStatus) {
    setStatuses(function(prev){ const n = Object.assign({}, prev); n[id] = newStatus; return n; });
    if (newStatus === "完了済み") {
      setCompletedDates(function(prev){ const n = Object.assign({}, prev); n[id] = new Date().toISOString(); return n; });
    } else {
      setCompletedDates(function(prev){ const n = Object.assign({}, prev); delete n[id]; return n; });
    }
  }
  function saveMemo(id, text) { setMemos(function(prev){ const n = Object.assign({}, prev); n[id] = text; return n; }); }
  function handleTouchStart(e) {
    touchStartX.current = e.touches[0].clientX;
  }
  function handleTouchEnd(e) {
    if (touchStartX.current === null) return;
    const diff = touchStartX.current - e.changedTouches[0].clientX;
    if (Math.abs(diff) < 50) return;
    if (diff > 0) {
      setFilterMonth(function(prev) {
        if (prev === 0) return today.getMonth() + 1;
        return prev === 12 ? 1 : prev + 1;
      });
    } else {
      setFilterMonth(function(prev) {
        if (prev === 0) return today.getMonth() + 1;
        return prev === 1 ? 12 : prev - 1;
      });
    }
    touchStartX.current = null;
  }

  function addCustomTask() {
    const id = "custom-" + Date.now();
    setCustomTasks(function(prev) {
      const n = Object.assign({}, prev);
      n[year] = (prev[year]||[]).concat([Object.assign({}, newTask, { id: id })]);
      return n;
    });
    setShowAddModal(false);
    setNewTask({ name:"", category:"行事", month:1, day:1, recurrence:"単発", noDate:false });
  }
  function saveEditTask() {
    if (!editTask) return;
    if (editTask.id.indexOf("custom-") === 0) {
      setCustomTasks(function(prev) {
        const n = Object.assign({}, prev);
        n[year] = (prev[year] || []).map(function(t){ return t.id === editTask.id ? Object.assign({}, editTask) : t; });
        return n;
      });
    } else {
      setOverrides(function(prev) {
        const n = Object.assign({}, prev);
        n[editTask.id] = { name: editTask.name, category: editTask.category, month: editTask.month, day: editTask.day, recurrence: editTask.recurrence };
        return n;
      });
    }
    setEditTask(null);
  }
  function deleteTask(task) {
    if (!window.confirm("「" + task.name + "」を削除しますか？")) return;
    if (task.id.indexOf("custom-") === 0) {
      removeCustomTask(task.id);
    } else {
      setDeletedIds(function(prev) { const n = new Set(prev); n.add(task.id); return n; });
    }
  }
  function removeCustomTask(id) {
    setCustomTasks(function(prev) {
      const n = Object.assign({}, prev);
      n[year] = (prev[year]||[]).filter(function(t){ return t.id !== id; });
      return n;
    });
    setStatuses(function(prev){ const n = Object.assign({}, prev); delete n[id]; return n; });
    setMemos(function(prev){ const n = Object.assign({}, prev); delete n[id]; return n; });
  }

  const urgentCount = allTasks.filter(function(t) {
    const days = getDaysUntil(t.date);
    return days >= 0 && days <= 14 && (statuses[t.id]||"実行前") !== "完了済み";
  }).length;
  const completedCount = allTasks.filter(function(t) {
    return t.category !== "行事" && (statuses[t.id]||"実行前") === "完了済み";
  }).length;

  const noDateTasks = filtered.filter(function(t){ return t.noDate && (statuses[t.id]||"実行前") !== "完了済み"; });
